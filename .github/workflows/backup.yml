# Nightly encrypted backup of the Supabase database (and, once the storage
# keys are set, the post and message images). Each run:
#   1. dumps the public, auth, and storage schemas with pg_dump,
#   2. copies the image buckets through Supabase's S3-compatible API,
#   3. restores the dump into a scratch Postgres and checks the row counts
#      match the live database (the run fails, and GitHub emails you, if not),
#   4. encrypts everything with BACKUP_PASSPHRASE and keeps it for 90 days.
# The repository is public, so nothing unencrypted is ever uploaded.
# See supabase/BACKUPS.md for setup and restore steps.
name: Database backup

on:
  schedule:
    - cron: "17 7 * * *" # daily, 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      S3_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      S3_SECRET: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      S3_ENDPOINT: https://qnytfkhvetgckbgueggx.supabase.co/storage/v1/s3
      SCRATCH_URL: postgresql://postgres:postgres@localhost:5432/restore_test
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi

      - name: Install Postgres 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump the database
        run: |
          mkdir -p backup
          pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file=backup/database.dump
          psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 -f - > backup/counts.txt <<'SQL'
          select 'auth.users', count(*) from auth.users
          union all select 'public.profiles', count(*) from public.profiles
          union all select 'public.posts', count(*) from public.posts
          union all select 'public.messages', count(*) from public.messages
          union all select 'public.wallets', count(*) from public.wallets
          union all select 'public.wallet_transactions', count(*) from public.wallet_transactions
          union all select 'storage.objects', count(*) from storage.objects
          union all select 'sum(public.wallets.balance)', coalesce(sum(balance), 0) from public.wallets
          order by 1;
          SQL
          echo "Live database:"; cat backup/counts.txt
          ls -lh backup/database.dump

      - name: Copy images
        run: |
          if [ -z "$S3_KEY_ID" ] || [ -z "$S3_SECRET" ] || [ -z "$S3_REGION" ]; then
            echo "::notice::Image backup skipped: storage S3 secrets not set."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$S3_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3_SECRET" AWS_DEFAULT_REGION="$S3_REGION"
          for bucket in post-images message-images; do
            aws s3 sync "s3://$bucket" "backup/images/$bucket" --endpoint-url "$S3_ENDPOINT" --only-show-errors
          done
          echo "Images: $(find backup/images -type f | wc -l) files, $(du -sh backup/images | cut -f1)"

      - name: Test restore into a scratch database
        run: |
          # Roles that Supabase policies and grants refer to.
          psql "$SCRATCH_URL" -X -q -c "create role anon; create role authenticated; create role service_role;"
          # Some Supabase-managed objects (extensions, managed roles) don't exist
          # in plain Postgres; those errors are expected. The row counts below
          # decide whether the backup is good.
          pg_restore --dbname="$SCRATCH_URL" --no-owner --no-privileges backup/database.dump 2> restore-errors.txt || true
          echo "pg_restore reported $(grep -c 'error:' restore-errors.txt || true) errors (Supabase-managed objects)."
          psql "$SCRATCH_URL" -X -At -v ON_ERROR_STOP=1 -f - > restored-counts.txt <<'SQL'
          select 'auth.users', count(*) from auth.users
          union all select 'public.profiles', count(*) from public.profiles
          union all select 'public.posts', count(*) from public.posts
          union all select 'public.messages', count(*) from public.messages
          union all select 'public.wallets', count(*) from public.wallets
          union all select 'public.wallet_transactions', count(*) from public.wallet_transactions
          union all select 'storage.objects', count(*) from storage.objects
          union all select 'sum(public.wallets.balance)', coalesce(sum(balance), 0) from public.wallets
          order by 1;
          SQL
          echo "Restored copy:"; cat restored-counts.txt
          if ! diff -u backup/counts.txt restored-counts.txt; then
            echo "::error::The restored backup doesn't match the live database."
            exit 1
          fi
          echo "Restore test passed: every count matches."

      - name: Encrypt
        run: |
          stamp=$(date -u +%Y-%m-%d)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          tar -czf - -C backup . | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output "galaxy500universe-$stamp.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup restored-counts.txt restore-errors.txt
          ls -lh "galaxy500universe-$stamp.tar.gz.gpg"

      - name: Store the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: galaxy500universe-${{ env.STAMP }}
          path: galaxy500universe-${{ env.STAMP }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
