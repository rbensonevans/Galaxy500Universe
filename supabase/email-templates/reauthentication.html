<!-- Galaxy500Universe email template: reauthentication. Paste into Supabase →
     Authentication → Emails → Templates → Reauthentication. Subject: Your Galaxy500Universe verification code -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Your Galaxy500Universe verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#07061a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#07061a;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
        <tr>
          <td style="padding:0 4px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.2px;color:#c4b5fd;">
            Galaxy500Universe
          </td>
        </tr>
        <tr>
          <td style="background-color:#14112e;border:1px solid #2a2550;border-radius:16px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e9e7f5;">
            <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;color:#ffffff;">Confirm it's you</h1>
            <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#c9c6dd;">Enter this code to confirm it's you:</p><p style="margin:0 0 20px;font-size:30px;font-weight:700;letter-spacing:6px;color:#ffffff;font-family:Menlo,Consolas,monospace;">{{ .Token }}</p><p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#c9c6dd;">The code expires soon.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7d7999;">
            If you didn't ask for this, you can ignore this email.<br>
            Questions? <a href="mailto:support@galaxy500universe.com" style="color:#a5b4fc;">support@galaxy500universe.com</a><br>
            <a href="https://www.galaxy500universe.com" style="color:#7d7999;">www.galaxy500universe.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
